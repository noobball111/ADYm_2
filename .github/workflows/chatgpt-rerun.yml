name: ChatGPT reproducibility rerun

on:
  push:
    branches:
      - chatgpt-rerun-20261002

permissions:
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository data
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==2.3.3" "numpy==2.3.5" "pyarrow==25.0.1" "scikit-learn==1.9.1" "lightgbm==4.7.0"

      - name: Run independent model rerun
        run: python chatgpt_rerun.py

      - name: Upload rerun results
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-solar-rerun
          path: chatgpt_rerun_results/
          if-no-files-found: error
