name: ChatGPT fresh rerun fixed
on:
  push:
    branches: [chatgpt-fresh-rerun-fixed-20261002]
permissions:
  contents: read
jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pandas==2.3.3 numpy==2.3.5 pyarrow==25.0.1 scikit-learn==1.9.1 lightgbm==4.7.0
      - run: python chatgpt_fresh_rerun_fixed.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-fresh-rerun-fixed
          path: chatgpt_fresh_rerun/
